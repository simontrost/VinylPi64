{% extends "layouts/base.html" %}
{% block title %}Logs – VinylPi64{% endblock %}
{% block page_styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/logs.css') }}?v=20261025-debug">
{% endblock %}
{% block page_scripts %}
<script src="{{ url_for('static', filename='js/pages/logs.js') }}?v=20261025-explicit-logging" defer></script>
{% endblock %}
{% block content %}
<main class="main">
    <header class="main-header">
        <div class="header-title pixel-title">Logs</div>
            <a href="/about.html" class="header-logo-link" aria-label="About VinylPi64" title="About VinylPi64"><img src="/static/images/logo.webp" alt="VinylPi64 logo" class="header-logo"></a>
    </header>
    <section class="logs-shell" aria-label="System diagnostics">
        <div class="logs-overview card">
            <div>
                <span class="eyebrow">System diagnostics</span>
                <h1>Messages &amp; errors</h1>
            </div>
            <div class="logs-status" role="status"><span id="logsLiveDot" class="logs-live-dot"></span><span id="logsLiveStatus">Connecting…</span></div>
        </div>
        <section class="card logs-card" aria-label="Log entries">
            <div class="logs-tools">
                <label class="logs-field">
                    <span>Show</span>
                    <select id="logsLevel" aria-label="Filter log level">
                        <option value="issues">Warnings &amp; errors</option>
                        <option value="all" selected>All messages</option>
                        <option value="errors">Errors only</option>
                        <option value="warnings">Warnings only</option>
                        <option value="info">Info only</option>
                        <option value="debug">Debug only</option>
                    </select>
                </label>
                <label class="logs-field logs-search">
                    <span>Search</span>
                    <input id="logsSearch" type="search" placeholder="Filter messages…" autocomplete="off">
                </label>
            </div>
            <div class="logs-verbose-wrap">
                <label class="logs-verbose-toggle"><input type="checkbox" id="logsVerbose" disabled><span>Detailed debug logging</span></label>
                <span class="logs-verbose-help" id="logsVerboseHelp" role="status" aria-live="polite"></span>
            </div>
            <div class="logs-actions">
                <div class="logs-count"><span id="logsCount">0</span> messages <span id="logsNew" class="logs-new" hidden></span></div>
                <div class="logs-action-buttons">
                    <button id="logsToggleLive" type="button" aria-pressed="true" title="Pause or resume updates">Pause live</button>
                    <button id="logsCopy" type="button" title="Copy visible entries">Copy</button>
                    <button id="logsHistory" type="button" aria-pressed="false" title="Show older messages kept in the local database">Show history</button>
                    <button id="logsClear" type="button" title="Hide all current messages (saved logs are kept)">Clear view</button>
                </div>
            </div>
            <div class="logs-stream" id="logsStream" role="log" aria-label="Recent log messages" aria-live="off">
                <div class="logs-empty">Loading messages…</div>
            </div>
            <p id="logsFeedback" class="logs-feedback" role="status" aria-live="polite"></p>
        </section>
    </section>
</main>
{% endblock %}

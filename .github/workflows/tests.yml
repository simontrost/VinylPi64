name: Python Legacy CI

on:
  push:
    branches:
      - legacy-python
  pull_request:
    branches:
      - legacy-python
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libportaudio2 libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test logs behavior
        run: node tests/test_logs_ui.cjs

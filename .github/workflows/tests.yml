name: Rust CI and Pi ARM64

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vinylpi64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust and web UI tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      # Source updates can be applied directly from the patch archive.
      # Normalize formatting in the CI checkout before the strict build checks.
      - name: Normalize Rust formatting
        run: cargo fmt --all
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Unit and API tests
        run: cargo test --locked --workspace
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          for file in web/static/js/pages/*.js; do node --check "$file"; done

  pi_arm64:
    name: Build Raspberry Pi Linux ARM64
    needs: test
    # Publish only tested builds from master, never pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 50
    permissions:
      contents: write  # Required to publish versioned GitHub releases.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      - name: Compile natively on Linux ARM64
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu
      - name: Package binary with commit identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 target/aarch64-unknown-linux-gnu/release/vinylpi64 dist/vinylpi64
          printf '%s\n' "$GITHUB_SHA" > dist/commit.txt
          (cd dist && sha256sum vinylpi64 > sha256.txt)
          tar -C dist -czf vinylpi64-aarch64.tar.gz vinylpi64 commit.txt sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vinylpi64-aarch64-${{ github.sha }}
          path: vinylpi64-aarch64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Publish versioned ARM64 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Do not publish an outdated master build.
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "Newer master commit exists; skipping publication."
            exit 0
          fi

          version="$(awk -F '"' '/^version = "/ {print $2; exit}' Cargo.toml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          series="${version%.*}.0"
          tag="v${series}"
          archive="vinylpi64-aarch64-${GITHUB_SHA}.tar.gz"

          cp vinylpi64-aarch64.tar.gz "$archive"

          notes="Current version: v${version}. Latest tested ARM64 commit: ${GITHUB_SHA}. This release tracks the ${series%.*}.x series."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --target "$GITHUB_SHA" \
              --title "$tag" \
              --notes "$notes"
          fi

          # Keep the rolling series tag aligned with its binary.
          gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
            -f sha="$GITHUB_SHA" \
            -F force=true >/dev/null

          gh release edit "$tag" \
            --title "$tag" \
            --notes "$notes" \
            --latest

          # Delete superseded binaries only after successful publication.
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          while IFS= read -r asset; do
            case "$asset" in
              vinylpi64-aarch64*.tar.gz)
                if [[ "$asset" != "$archive" ]]; then
                  gh release delete-asset "$tag" "$asset" --yes
                fi
                ;;
            esac
          done <<< "$assets"

          # Retire the previous experimental release.
          if gh release view rust-dev >/dev/null 2>&1; then
            gh release delete rust-dev --yes
          fi

<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>VinylPi Statistics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#06081A">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="stats.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="stats.js" defer></script>
</head>

<body>
    <aside class="sidebar">
        <nav class="nav">
            <a href="index.html">Dashboard</a>
            <a href="settings.html">Settings</a>
            <a href="pixoo.html">Pixoo</a>
            <a href="stats.html" class="active">Statistics</a>
            <a href="about.html">About</a>
        </nav>
    </aside>

    <main class="main">
        <header class="main-header">
            <div class="header-title pixel-title">Statistics</div>
            <img src="logo.png" class="header-logo" alt="VinylPi Logo">
        </header>

        <section class="stats-section">
            <div class="stats-minutes-card">
                <div class="stats-minutes-label">Minutes listened</div>
                <div id="stats-minutes" class="stats-minutes-value">—</div>
                <div class="stats-minutes-sub">Based on recognized tracks</div>
            </div>
            <div class="stats-grid">
                <div class="stats-card">
                    <h2>Top Songs</h2>
                    <ul id="stats-songs" class="stats-list"></ul>
                </div>

                <div class="stats-card">
                    <h2>Top Artists</h2>
                    <ul id="stats-artists" class="stats-list"></ul>
                </div>

                <div class="stats-card">
                    <h2>Top Albums</h2>
                    <ul id="stats-albums" class="stats-list"></ul>
                </div>
            </div>

            <div class="stats-visual-grid">
                <div class="stats-card stats-chart-card">
                    <h2>Top Genres</h2>
                    <canvas id="genre-radar"></canvas>
                </div>

                <div class="stats-card stats-chart-card album-carousel-card">
                    <h2>Top Albums</h2>
                    <div id="album-carousel" class="album-carousel"></div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
